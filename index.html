function RouteWeather({startLoc,limits,onPlan,forest,onForest}){
  const [destQ,setDestQ]=useState(""); const [destRes,setDestRes]=useState([]); const [dest,setDest]=useState(null);
  const speed=75;
  const [plan,setPlan]=useState(null); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");
  const [useHwy,setUseHwy]=useState(true);
  const [saved,setSaved]=useState([]);
  const debRef=useRef(null), boxRef=useRef(null);
  useEffect(()=>{ const s=lsGet(ROUTE_KEY); if(Array.isArray(s)) setSaved(s); },[]);
  useEffect(()=>()=>{ if(onPlan)onPlan(null); },[]);
  const persist=list=>{ setSaved(list); lsSet(ROUTE_KEY,list); };
  const saveDest=()=>{ if(!dest||saved.some(s=>s.name===dest.name)) return; persist([{name:dest.name,lat:dest.lat,lon:dest.lon},...saved].slice(0,8)); };
  const delSaved=name=>persist(saved.filter(s=>s.name!==name));
  useEffect(()=>{ if(debRef.current)clearTimeout(debRef.current); if(destQ.trim().length<2){setDestRes([]);return;}
    debRef.current=setTimeout(async()=>{ try{ const j=await(await fetch(GEO_BASE+"?name="+encodeURIComponent(destQ.trim())+"&count=6&language=hu&format=json")).json(); setDestRes(Array.isArray(j.results)?j.results:[]); }catch{ setDestRes([]); } },320);
    return ()=>clearTimeout(debRef.current); },[destQ]);
  useEffect(()=>{ const f=e=>{ if(boxRef.current&&!boxRef.current.contains(e.target)) setDestRes([]); }; document.addEventListener("mousedown",f); return ()=>document.removeEventListener("mousedown",f); },[]);
  const hav=(a,b)=>{ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
  const locHour=d=>{ const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours()); };
  const bearing=(a,b)=>{ const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180; const y=Math.sin(dl)*Math.cos(la2); const x=Math.cos(la1)*Math.sin(la2)-Math.sin(la1)*Math.cos(la2)*Math.cos(dl); return (Math.atan2(y,x)*180/Math.PI+360)%360; };
  const sevNum=p=>{ const w=p&&p.wx; if(!w) return -1; let s=0; const st=[95,96,99,56,57,66,67,73,75,85,86].includes(w.code);
    if(st||w.pop>=limits.pop||w.gust>=limits.gust||w.prec>=0.6) s=2; else if(w.pop>=limits.pop*0.6||w.gust>=limits.gust*0.75||w.prec>=0.1) s=1;
    if(p.cross>=45) s=Math.max(s,2); else if(p.cross>=28) s=Math.max(s,1);
    if(p.ice==="ice") s=2; else if(p.ice==="frost") s=Math.max(s,1);
    if([45,48].includes(w.code)) s=Math.max(s,1); return s; };
  const sevColor=p=>{ const s=sevNum(p); return s<0?"#6b7689":["#4ade80","#facc15","#f87171"][s]; };
  const warnOf=p=>{ const a=[]; if(p.cross>=45) a.push("🌬️ erős oldalszél "+p.cross); else if(p.cross>=28) a.push("🌬️ oldalszél "+p.cross); if(p.wx&&[45,48].includes(p.wx.code)) a.push("🌫️ köd"); if(p.ice==="ice") a.push("🧊 jegesedés"); else if(p.ice==="frost") a.push("❄️ fagyveszély"); return a; };
  const planRoute=async(destArg)=>{
    const d=destArg||dest;
    if(!d||!startLoc) return; setBusy(true); setErr(""); setPlan(null); if(onPlan)onPlan(null);
    try{
      const tryOSRM=async(excl)=>{ try{ const ru="https://router.project-osrm.org/route/v1/driving/"+startLoc.lon+","+startLoc.lat+";"+d.lon+","+d.lat+"?overview=full&geometries=geojson"+(excl?"&exclude=motorway":""); const rj=await(await fetch(ru)).json(); if(rj&&rj.routes&&rj.routes[0]&&rj.routes[0].geometry&&rj.routes[0].geometry.coordinates.length>1) return rj.routes[0].geometry.coordinates; }catch(e){} return null; };
      let coords=await tryOSRM(!useHwy), excluded=!useHwy&&!!coords, mode="road";
      if(!coords&&!useHwy){ coords=await tryOSRM(false); excluded=false; }
      if(!coords){ coords=[[startLoc.lon,startLoc.lat],[d.lon,d.lat]]; mode="air"; excluded=false; }
      const pp=c=>({lat:c[1],lon:c[0]});
      const cum=[0]; for(let i=1;i<coords.length;i++) cum.push(cum[i-1]+hav(pp(coords[i-1]),pp(coords[i])));
      const total=cum[cum.length-1]||hav(startLoc,d);
      const N=Math.max(4,Math.min(9,Math.round(total/45)+2)); const pts=[];
      for(let k=0;k<N;k++){ const target=total*k/(N-1); let i=1; while(i<cum.length&&cum[i]<target) i++; if(i>=cum.length) i=cum.length-1;
        const segLen=(cum[i]-cum[i-1])||1, f=(target-cum[i-1])/segLen, a=pp(coords[i-1]), b=pp(coords[i]);
        pts.push({lat:a.lat+(b.lat-a.lat)*f, lon:a.lon+(b.lon-a.lon)*f, dist:target}); }

      const dep=new Date(); pts.forEach(p=>{ p.eta=new Date(dep.getTime()+(p.dist/Math.max(20,speed))*3600000); });
      const lats=pts.map(p=>p.lat.toFixed(4)).join(","), lons=pts.map(p=>p.lon.toFixed(4)).join(",");
      const url="https://api.open-meteo.com/v1/forecast?latitude="+lats+"&longitude="+lons+"&timezone=auto&forecast_days=3&wind_speed_unit=kmh&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,dew_point_2m,uv_index,visibility";
      const r=await(await fetch(url)).json(); const arr=Array.isArray(r)?r:[r];
      pts.forEach((p,i)=>{ const h=arr[i]&&arr[i].hourly; if(!h||!h.time){p.wx=null;p.cross=0;p.ice=null;return;} let idx=h.time.findIndex(t=>t.slice(0,13)===locHour(p.eta)); if(idx<0)idx=0;
        p.wx={temp:Math.round(h.temperature_2m[idx]),feel:Math.round(h.apparent_temperature?.[idx]??h.temperature_2m[idx]),pop:h.precipitation_probability?.[idx]??0,prec:h.precipitation?.[idx]??0,code:h.weather_code[idx],wind:Math.round(h.wind_speed_10m?.[idx]??0),gust:Math.round(h.wind_gusts_10m?.[idx]??0),wdir:h.wind_direction_10m?.[idx]??null,dew:h.dew_point_2m?.[idx]??null,uv:h.uv_index?.[idx]??0,vis:h.visibility?.[idx]??null};
        p.cross = (p.wx.wdir!=null&&p.bearing!=null) ? Math.round(p.wx.gust*Math.abs(Math.sin((p.wx.wdir-p.bearing)*Math.PI/180))) : 0;

function tilePix(lat,lon,z){ const n=Math.pow(2,z); const xf=(lon+180)/360*n; const r=lat*Math.PI/180; const yf=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n; const xt=Math.floor(xf),yt=Math.floor(yf); return {xt,yt,px:Math.floor((xf-xt)*256),py:Math.floor((yf-yt)*256)}; }
async function radarNow(lat,lon){
  if(OMSZ_RADAR_URL){
    try{
      const j=await(await fetch(OMSZ_RADAR_URL+"?lat="+lat+"&lon="+lon)).json();
      if(j&&j.ok&&j.state&&j.state!=="no_data"){
        const st = j.state==="storm" ? "storm" : (j.state==="heavy"||j.state==="rain") ? "rain" : "dry";
        return {state:st, ts:Math.floor(Date.now()/1000), src:"omsz", dbz:j.dbz};
      }
    }catch(e){}
  }
  try{
    const meta=await(await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
    const frames=meta&&meta.radar&&meta.radar.past;
    if(!meta||!meta.host||!frames||!frames.length) return {state:"unknown"};
    const fr=frames[frames.length-1], z=8, t=tilePix(lat,lon,z);
    const url=meta.host+fr.path+"/256/"+z+"/"+t.xt+"/"+t.yt+"/6/1_1.png";
    const img=new Image(); img.crossOrigin="anonymous";
    const ok=await new Promise(res=>{ img.onload=()=>res(true); img.onerror=()=>res(false); img.src=url; });
    if(!ok) return {state:"unknown"};
    const c=document.createElement("canvas"); c.width=256; c.height=256; const ctx=c.getContext("2d"); ctx.drawImage(img,0,0);
    let hit=0, heavy=0;
    for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=3;dy++){ const x=Math.min(255,Math.max(0,t.px+dx)), y=Math.min(255,Math.max(0,t.py+dy)); const d=ctx.getImageData(x,y,1,1).data; if(d[3]>70){ hit++; if(d[0]>170&&d[1]<160&&d[2]<140) heavy++; } }
    if(hit<2) return {state:"dry", ts:fr.time};
    return {state: heavy>=2?"storm":"rain", ts:fr.time};
  }catch(e){ return {state:"unknown"}; }
}
function rideChill(T,windKmh,speed){ const V=speed+0.5*(windKmh||0); if(T>=15||V<5) return null; const p=Math.pow(V,0.16); const wc=13.12+0.6215*T-11.37*p+0.3965*T*p; return Math.round(Math.min(wc,T)); }
function nowcastSeries(data){
  if(!data||!data.minutely_15||!data.minutely_15.time) return null;
  const M=data.minutely_15, P=M.precipitation||[], now=Date.now();
  let start=M.time.findIndex(t=>new Date(t).getTime()>=now-60000); if(start<0) start=0;
  const pts=[]; for(let i=start;i<M.time.length&&pts.length<9;i++){ pts.push(P[i]||0); }

}
function frontInfo(data){
  const c=(data&&data.current)||{}, H=data&&data.hourly;
  if(!H||!H.pressure_msl||!H.time) return null;
  const now=Date.now(); let idx=H.time.findIndex(t=>new Date(t).getTime()>now); if(idx<1) idx=1; idx=Math.min(idx,H.time.length-1);
  const pNow=c.pressure_msl!=null?c.pressure_msl:H.pressure_msl[idx];
  const p3=H.pressure_msl[Math.max(0,idx-3)];
  const ptrend=+(pNow-p3).toFixed(1);
  const tNow=H.temperature_2m[idx], tAhead=H.temperature_2m[Math.min(H.time.length-1,idx+6)];

}
const FRONT_INFO={

function departureVerdict({data,nowcast,radar,limits}){

function GearAdvice({data,plan,forest}){
  const hasRoute = plan&&plan.pts&&plan.pts.some(p=>p.wx);
  const spLo = hasRoute ? (plan.rideSpeedLo||90) : 90;
  const spHi = hasRoute ? (plan.rideSpeedHi||110) : 110;
  const fAdj = forest ? 2 : 0;
  let feel,feelWarm,pmax=0,gmax=0,precip=0,uvmax=0,fog=false,chill=false,scope,range,ambient;
  if(hasRoute){
    const ps=plan.pts.filter(p=>p.wx); let mnH=Infinity,mnL=Infinity,amn=Infinity;
    ps.forEach(p=>{ const T=p.wx.temp-fAdj; const amb=(p.wx.feel!=null?p.wx.feel:p.wx.temp)-fAdj; const rh=rideChill(T,p.wx.wind,spHi), rl=rideChill(T,p.wx.wind,spLo); const fh=(rh!=null?rh:amb), flw=(rl!=null?rl:amb); if(rh!=null)chill=true; if(fh<mnH)mnH=fh; if(flw<mnL)mnL=flw; if(amb<amn)amn=amb; if(p.wx.pop>pmax)pmax=p.wx.pop; if(p.wx.gust>gmax)gmax=p.wx.gust; precip+=(p.wx.prec||0); const uv=p.wx.uv??0; if(uv>uvmax)uvmax=uv; if([45,48].includes(p.wx.code)||(p.wx.vis!=null&&p.wx.vis<1500))fog=true; });
    feel=Math.round(mnH); feelWarm=Math.round(mnL); ambient=Math.round(amn); scope="route"; range="🛣️ teljes útvonal · ≈ "+Math.round(plan.total)+" km";

    const ss=data.daily&&data.daily.sunset&&data.daily.sunset[0];
    if(ss){ const si=H.time.findIndex(t=>t.slice(0,13)===ss.slice(0,13)); if(si>s) e=Math.min(si+1,s+12); }
    e=Math.max(s+4,Math.min(e,H.time.length));
    let mnH=Infinity,mnL=Infinity,amn=Infinity,vmin=Infinity;
    for(let i=s;i<e;i++){ const t=H.temperature_2m[i]-fAdj; const w=H.wind_speed_10m?.[i]??0; const a=H.apparent_temperature?.[i]; const amb=(a!=null?a:H.temperature_2m[i])-fAdj; const rh=rideChill(t,w,spHi), rl=rideChill(t,w,spLo); const fh=(rh!=null?rh:amb), flw=(rl!=null?rl:amb); if(rh!=null)chill=true; if(fh<mnH)mnH=fh; if(flw<mnL)mnL=flw; if(amb<amn)amn=amb;
      const pp=H.precipitation_probability?.[i]??0; if(pp>pmax)pmax=pp; const g=H.wind_gusts_10m?.[i]??0; if(g>gmax)gmax=g; precip+=H.precipitation?.[i]??0;
      const uv=H.uv_index?.[i]??0; if(uv>uvmax)uvmax=uv; if([45,48].includes(H.weather_code[i]))fog=true; const v=H.visibility?.[i]; if(v!=null&&v<vmin)vmin=v; }
    if(vmin<1500)fog=true; feel=Math.round(mnH); feelWarm=Math.round(mnL); ambient=Math.round(amn); scope="local"; range=H.time[s].slice(11,16)+"–"+H.time[e-1].slice(11,16);
  }
  const feelTxt = chill ? (feel+"…"+feelWarm+"° menetszél-hőérzet (álló: "+ambient+"°)") : (feel+"° hőérzet");
  const items=[];
  if(feel<5) items.push({i:"🧥",t:"Téli/fűthető kesztyű, nyakmelegítő és melegítő réteg — "+feelTxt});
  else if(feel<12) items.push({i:"🧥",t:"Béléses, szélálló dzseki, ujjas alsó réteg — "+feelTxt});
  else if(feel<=20) items.push({i:"🧥",t:"Szélálló kabát könnyű réteggel — "+feelTxt});

  if(gmax>=50) items.push({i:"💨",t:"Erős lökések (akár "+Math.round(gmax)+" km/h) — számíts oldalszélre, laza felsőtest, feszesebb fogás"});

function RouteMap({coords,pts,colorOf}){
  const T=256, VH=260;
  const [vw,setVw]=useState(340);
  const boxRef=useRef(null);
  useEffect(()=>{ const m=()=>{ if(boxRef.current) setVw(boxRef.current.clientWidth); }; m(); window.addEventListener("resize",m); return ()=>window.removeEventListener("resize",m); },[]);
  if(!coords||coords.length<2) return null;
  const merc=la=>{ const r=la*Math.PI/180; return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2; };
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  coords.forEach(c=>{ if(c[0]<minLon)minLon=c[0]; if(c[0]>maxLon)maxLon=c[0]; if(c[1]<minLat)minLat=c[1]; if(c[1]>maxLat)maxLat=c[1]; });
  const cLon=(minLon+maxLon)/2, cLat=(minLat+maxLat)/2;
  let z=11; for(z=11; z>=3; z--){ const n2=Math.pow(2,z); const wpx=Math.max(1e-4,(maxLon-minLon))/360*n2*T; const hpx=Math.max(1e-4,Math.abs(merc(minLat)-merc(maxLat)))*n2*T; if(wpx<=vw*0.85 && hpx<=VH*0.85) break; }
  const n=Math.pow(2,z);
  const cx=((cLon+180)/360)*n, cy=merc(cLat)*n;
  const originX=cx*T-vw/2, originY=cy*T-VH/2;
  const px=lon=>((lon+180)/360)*n*T-originX;
  const py=lat=>merc(lat)*n*T-originY;
  const x0=Math.floor(originX/T),x1=Math.floor((originX+vw)/T),y0=Math.floor(originY/T),y1=Math.floor((originY+VH)/T);
  const tiles=[]; for(let tx=x0;tx<=x1;tx++) for(let ty=y0;ty<=y1;ty++){ if(ty<0||ty>=n) continue; tiles.push({key:tx+"_"+ty,wx:((tx%n)+n)%n,wy:ty,left:tx*T-originX,top:ty*T-originY}); }
  const path="M"+coords.map(c=>px(c[0]).toFixed(1)+","+py(c[1]).toFixed(1)).join(" L");
  return (
    <div className="rt-mapbox" ref={boxRef}>
      {tiles.map(t=>(<img key={t.key} alt="" className="rad-tile" src={"https://a.basemaps.cartocdn.com/rastertiles/voyager/"+z+"/"+t.wx+"/"+t.wy+".png"} style={{left:t.left,top:t.top,width:T,height:T}} />))}
      <svg width={vw} height={VH} style={{position:"absolute",left:0,top:0,pointerEvents:"none"}}>
        <path d={path} fill="none" stroke="rgba(8,12,20,.6)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" />
        <path d={path} fill="none" stroke="#5b8cff" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p,i)=>(<circle key={i} cx={px(p.lon).toFixed(1)} cy={py(p.lat).toFixed(1)} r={(i===0||i===pts.length-1)?6.5:5.5} fill={colorOf(p)} stroke="#0a0f19" strokeWidth="2.4" />))}
        {pts.map((p,i)=>{ if(!p.wx||p.cross<28||p.wx.wdir==null) return null;
          const b=((p.wx.wdir+180)%360)*Math.PI/180, dx=Math.sin(b), dy=-Math.cos(b);
          const X=px(p.lon), Y=py(p.lat), L=26, tx=X+dx*L, ty=Y+dy*L;
          const col=p.cross>=45?"#f87171":"#facc15", ah=8, aa=0.5;
          const lx=tx-(dx*Math.cos(aa)-dy*Math.sin(aa))*ah, ly=ty-(dy*Math.cos(aa)+dx*Math.sin(aa))*ah;
          const rx=tx-(dx*Math.cos(-aa)-dy*Math.sin(-aa))*ah, ry=ty-(dy*Math.cos(-aa)+dx*Math.sin(-aa))*ah;
          return (<g key={"w"+i}>
            <line x1={X} y1={Y} x2={tx.toFixed(1)} y2={ty.toFixed(1)} stroke={col} strokeWidth="3" strokeLinecap="round" />
            <polygon points={tx.toFixed(1)+","+ty.toFixed(1)+" "+lx.toFixed(1)+","+ly.toFixed(1)+" "+rx.toFixed(1)+","+ry.toFixed(1)} fill={col} />
            <text x={(X+dx*L*1.6).toFixed(1)} y={(Y+dy*L*1.6+4).toFixed(1)} fontSize="11.5" fontWeight="700" fill={col} stroke="#0a0f19" strokeWidth="2.6" paintOrder="stroke" textAnchor="middle">{p.cross}</text>
          </g>);
        })}
      </svg>
    </div>
  );

/* SVG grafikon — középre rögzített olvasófej, oldalra húzható */
function Chart({data}){
  const wrapRef=useRef(null);
  const [W,setW]=useState(680);
  const [center,setCenter]=useState(0);
  const drag=useRef(null);
  const WIN=12;
  const Hpx=300, padL=44, padR=16, padT=20, padB=34;
  useEffect(()=>{ const m=()=>{ if(wrapRef.current) setW(wrapRef.current.clientWidth); }; m(); window.addEventListener("resize",m); return ()=>window.removeEventListener("resize",m); },[]);
  const iw=W-padL-padR, ih=Hpx-padT-padB;
  const maxC=Math.max(0,data.length-1);
  const c=Math.max(0,Math.min(maxC,center));
  const off=c-WIN/2;
  let tMin=Infinity,tMax=-Infinity;
  data.forEach(d=>{ tMin=Math.min(tMin,d.temp); tMax=Math.max(tMax,d.temp); if(d.band){tMin=Math.min(tMin,d.band[0]);tMax=Math.max(tMax,d.band[1]);} });
  const tp=Math.max(1,(tMax-tMin)*0.12); tMin=Math.floor(tMin-tp); tMax=Math.ceil(tMax+tp);
  const xg=i=>padL+((i-off)/WIN)*iw;
  const yT=v=>padT+(1-(v-tMin)/(tMax-tMin))*ih;
  const yP=v=>padT+(1-v/100)*ih;
  const vis=[]; for(let i=0;i<data.length;i++){ const xx=xg(i); if(xx>=padL-40&&xx<=W-padR+40) vis.push(i); }
  const lo=vis[0]??0, hi=vis[vis.length-1]??0;
  const tempLine=vis.map((i,k)=>(k?"L":"M")+xg(i)+","+yT(data[i].temp)).join(" ");
  const feelLine=vis.length>1?("M"+vis.map(i=>xg(i)+","+yT(data[i].feel)).join(" L")):"";
  const tempArea=vis.length?tempLine+" L"+xg(hi)+","+(padT+ih)+" L"+xg(lo)+","+(padT+ih)+" Z":"";
  const bandVis=vis.filter(i=>data[i].band);
  let bandPath=null;
  if(bandVis.length>1){ const top=bandVis.map(i=>xg(i)+","+yT(data[i].band[1])); const bot=bandVis.map(i=>xg(i)+","+yT(data[i].band[0])).reverse(); bandPath="M"+top.join(" L")+" L"+bot.join(" L")+" Z"; }
  const rhVis=vis.filter(i=>data[i].rh!=null);
  const rhLine=rhVis.length>1?("M"+rhVis.map(i=>xg(i)+","+yP(data[i].rh)).join(" L")):"";
  let wMax=0; data.forEach(d=>{ if(d.wind>wMax) wMax=d.wind; if(d.gust>wMax) wMax=d.gust; }); wMax=Math.max(20,Math.ceil(wMax/10)*10);
  const yW=v=>padT+(1-v/wMax)*ih;
  const windLine=vis.length>1?("M"+vis.map(i=>xg(i)+","+yW(data[i].wind)).join(" L")):"";
  const gustLine=vis.length>1?("M"+vis.map(i=>xg(i)+","+yW(data[i].gust)).join(" L")):"";
  const bw=Math.max(6,(iw/WIN)*0.5);
  const ticks=[tMin,Math.round((tMin+tMax)/2),tMax];
  const cxL=padL+iw/2;
  const ci=Math.round(c), d0=data[ci]||data[0];
  const base=new Date(data[0].time.slice(0,10)), cd=new Date(d0.time.slice(0,10)), diff=Math.round((cd-base)/86400000);
  const dayLabel=["Vasárnap","Hétfő","Kedd","Szerda","Csütörtök","Péntek","Szombat"][new Date(d0.time).getDay()];
  const cxe=e=>(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX);
  const down=e=>{ drag.current={x:cxe(e),c}; };
  const move=e=>{ if(drag.current){ const dx=cxe(e)-drag.current.x; const dH=-(dx/iw)*WIN; setCenter(Math.max(0,Math.min(maxC,drag.current.c+dH))); } };
  const up=()=>{ drag.current=null; };
  const step=h=>setCenter(v=>Math.max(0,Math.min(maxC,v+h)));
  const out={paintOrder:"stroke",stroke:"rgba(8,11,20,0.92)",strokeWidth:3.6,strokeLinejoin:"round"};
  const clipId="clipPlot";
  return (
    <div>
      <div className="chart-bar">
        <button className="chart-nav" onClick={()=>step(-3)}>‹</button>
        <span className="chart-time">{dayLabel} {d0.label}</span>
        <button className="chart-nav" onClick={()=>step(3)}>›</button>
      </div>
      <div className="chart-wrap" ref={wrapRef} style={{height:Hpx}}
        onMouseDown={down} onMouseMove={move} onMouseUp={up} onMouseLeave={up}
        onTouchStart={down} onTouchMove={move} onTouchEnd={up}>
        <svg className="chart-svg" width={W} height={Hpx}>
          <defs>
            <linearGradient id="gTemp" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffb347" stopOpacity="0.45"/><stop offset="100%" stopColor="#ffb347" stopOpacity="0"/></linearGradient>
            <clipPath id={clipId}><rect x={padL} y="0" width={iw} height={Hpx}/></clipPath>
          </defs>
          {ticks.map((t,k)=>(<g key={k}><line x1={padL} y1={yT(t)} x2={W-padR} y2={yT(t)} stroke="rgba(255,255,255,0.06)"/><text x={padL-8} y={yT(t)+5} fill="#9aa6b8" fontSize="14" textAnchor="end">{t}°</text></g>))}
          <g clipPath={"url(#"+clipId+")"}>
            {bandPath&&<path d={bandPath} fill="rgba(120,170,255,0.16)"/>}
            {vis.map(i=>{ const a=data[i].prec||0; if(a<=0.02) return null; const h=Math.min(1,a/5)*ih; return <rect key={"r"+i} x={xg(i)-bw/2} y={padT+ih-h} width={bw} height={h} rx="2.5" fill="rgba(96,165,250,0.55)"/>; })}
            {rhLine&&<path d={rhLine} fill="none" stroke="#5eead4" strokeWidth="2" strokeDasharray="5 4"/>}
            {windLine&&<path d={windLine} fill="none" stroke="#c4b5fd" strokeWidth="2" strokeDasharray="1.5 4" strokeLinecap="round"/>}
            {gustLine&&<path d={gustLine} fill="none" stroke="#c4b5fd" strokeWidth="1.5" strokeOpacity="0.42" strokeDasharray="1 5" strokeLinecap="round"/>}
            {tempArea&&<path d={tempArea} fill="url(#gTemp)"/>}
            {feelLine&&<path d={feelLine} fill="none" stroke="#fdba74" strokeWidth="2" strokeDasharray="6 4" strokeOpacity="0.9"/>}
            <path d={tempLine} fill="none" stroke="#ffb347" strokeWidth="3"/>
            {vis.map(i=>(i%2===0)?<text key={"l"+i} x={xg(i)} y={Hpx-11} fill="#9aa6b8" fontSize="13.5" textAnchor="middle">{data[i].label.slice(0,2)}</text>:null)}
          </g>
          {/* középre rögzített olvasófej */}
          <line x1={cxL} y1={padT-6} x2={cxL} y2={padT+ih} stroke="rgba(255,255,255,0.45)" strokeWidth="1.5"/>
          <circle cx={cxL} cy={yT(d0.temp)} r="4.5" fill="#ffb347"/>
          <circle cx={cxL} cy={yT(d0.feel)} r="3.2" fill="#fdba74"/>
          {d0.rh!=null&&<circle cx={cxL} cy={yP(d0.rh)} r="3.5" fill="#5eead4"/>}
          {d0.prec>0.02&&<circle cx={cxL} cy={padT+ih-Math.min(1,d0.prec/5)*ih} r="3.5" fill="#60a5fa"/>}
          <circle cx={cxL} cy={yW(d0.gust)} r="3.2" fill="#c4b5fd" fillOpacity="0.5"/>
          <circle cx={cxL} cy={yW(d0.wind)} r="3.5" fill="#c4b5fd"/>
          <text x={cxL+9} y={yT(d0.temp)+5} fontSize="15" fontWeight="700" fill="#ffce8a" style={out}>{d0.temp}°</text>
          {d0.feel!=null&&<text x={cxL-9} y={yT(d0.feel)+5} fontSize="12.5" fontWeight="600" fill="#fdba74" textAnchor="end" style={out}>Hő {d0.feel}°</text>}
          {d0.rh!=null&&<text x={cxL+9} y={yP(d0.rh)+5} fontSize="13" fontWeight="600" fill="#5eead4" style={out}>Pá {d0.rh}%</text>}
          <text x={cxL+9} y={padT+ih-7} fontSize="13" fontWeight="600" fill="#93c5fd" style={out}>Cs {(d0.prec||0).toFixed(1)} mm · {d0.pop}%</text>
          <text x={cxL+9} y={yW(d0.wind)+5} fontSize="12.5" fontWeight="600" fill="#c4b5fd" style={out}>Sz {d0.wind} · lökés {d0.gust} km/h</text>
        </svg>
      </div>
    </div>
  );
}

function cmapColor(stops,t){ t=Math.max(0,Math.min(1,t)); for(let i=1;i<stops.length;i++){ if(t<=stops[i][0]){ const a=stops[i-1],b=stops[i],f=(t-a[0])/((b[0]-a[0])||1); return [Math.round(a[1][0]+(b[1][0]-a[1][0])*f),Math.round(a[1][1]+(b[1][1]-a[1][1])*f),Math.round(a[1][2]+(b[1][2]-a[1][2])*f)]; } } const e=stops[stops.length-1][1]; return [e[0],e[1],e[2]]; }
function cmapCss(stops){ return "linear-gradient(90deg,"+stops.map(s=>"rgb("+s[1][0]+","+s[1][1]+","+s[1][2]+") "+Math.round(s[0]*100)+"%").join(",")+")"; }

function WeatherMap({lat,lon}){
  const [base,setBase]=useState("plain");
  const [layer,setLayer]=useState("precip");
  const [z,setZ]=useState(6);
  const [maps,setMaps]=useState(null);
  const [idx,setIdx]=useState(0);
  const [playing,setPlaying]=useState(true);
  const [vw,setVw]=useState(680);
  const [err,setErr]=useState(false);
  const [pre,setPre]=useState({done:0,total:0});
  const [grid,setGrid]=useState(null);   // statikus rács: {cols,rows,vals,layer}
  const [gLoad,setGLoad]=useState(false);
  const [fc,setFc]=useState(null);       // előrejelzés rács: {cols,rows,hours:[[v..]],frames:[{iso,ts}]}
  const boxRef=useRef(null),timer=useRef(null),canvasRef=useRef(null);
  const VH=330,T=256;
  const curL=MAP_LAYERS.find(l=>l.id===layer);
  const tl=!!curL.precipts;               // csapadék-idővonal (radar most→nowcast→előrejelzés +1 nap)
  const maxZ=tl?7:11;

  // Egyesített, előre néző idővonal: [most radar] + [radar nowcast] + [órás előrejelzés ... +1 nap]
  const frames=useMemo(()=>{
    if(!tl) return [];
    const out=[], now=Date.now();
    if(maps&&maps.radar&&maps.radar.length){
      const past=maps.radar.filter(f=>!f.future);
      const last=past.length?past[past.length-1]:null;
      if(last) out.push({kind:"radar",path:last.path,ts:last.time*1000});
      maps.radar.filter(f=>f.future).forEach(f=>out.push({kind:"radar",path:f.path,ts:f.time*1000}));
    }
    if(fc&&fc.frames&&fc.frames.length){
      const lastTs=out.length?out[out.length-1].ts:now, limit=now+24*3600*1000;
      fc.frames.forEach((f,hi)=>{ if(f.ts>lastTs+60000 && f.ts<=limit) out.push({kind:"fc",hourIdx:hi,ts:f.ts}); });
    }
    return out;
  },[tl,maps,fc]);

  useEffect(()=>{ const m=()=>{ if(boxRef.current) setVw(boxRef.current.clientWidth); }; m(); window.addEventListener("resize",m); return ()=>window.removeEventListener("resize",m); },[]);
  useEffect(()=>{ let cancel=false; (async()=>{ try{ const j=await(await fetch("https://api.rainviewer.com/public/weather-maps.json")).json(); if(cancel) return;
      const radar=[...(((j.radar&&j.radar.past)||[]).map(f=>({...f,future:false}))),...(((j.radar&&j.radar.nowcast)||[]).map(f=>({...f,future:true})))];
      setMaps({host:j.host,radar}); }catch{ if(!cancel) setErr(true); } })(); return ()=>{cancel=true;}; },[]);

  // mindig a mostani időponttól (az idővonal első kockája = most)
  useEffect(()=>{ setIdx(0); },[layer,maps,fc]);
  useEffect(()=>{ if(!playing||!tl||frames.length===0) return; timer.current=setInterval(()=>setIdx(i=>(i+1)%frames.length),750); return ()=>clearInterval(timer.current); },[playing,tl,frames]);
  useEffect(()=>{ if(tl&&z>7) setZ(7); },[tl]);

  // RainViewer csempék előtöltése (csak a radar-kockákhoz)
  useEffect(()=>{ if(!tl||!maps||!frames.length) return;
    const radarFrames=frames.filter(f=>f.kind==="radar"); if(!radarFrames.length) return;
    const n2=Math.pow(2,z), cx2=((lon+180)/360)*n2, latR2=lat*Math.PI/180, cy2=((1-Math.log(Math.tan(latR2)+1/Math.cos(latR2))/Math.PI)/2)*n2;
    const oX=cx2*T-vw/2,oY=cy2*T-VH/2, xa=Math.floor(oX/T),xb=Math.floor((oX+vw)/T),ya=Math.floor(oY/T),yb=Math.floor((oY+VH)/T);
    const coords=[]; for(let tx=xa;tx<=xb;tx++) for(let ty=ya;ty<=yb;ty++){ if(ty<0||ty>=n2) continue; coords.push({wx:((tx%n2)+n2)%n2,wy:ty}); }
    const urls=[]; coords.forEach(c=>{ radarFrames.forEach(f=>urls.push(maps.host+f.path+"/256/"+z+"/"+c.wx+"/"+c.wy+"/2/1_1.png")); });
    let done=0,alive=true; setPre({done:0,total:urls.length});
    urls.forEach(u=>{ const img=new Image(); const tick=()=>{ if(alive) setPre({done:++done,total:urls.length}); }; img.onload=tick; img.onerror=tick; img.src=u; });
    return ()=>{alive=false;}; },[tl,maps,z,lat,lon,vw,frames.length]);

  // Open-Meteo statikus rács (nem-idővonalas rétegek: hő, szél, stb.) — egyetlen kérés, kulcs nélkül
  useEffect(()=>{ if(tl){ setGrid(null); return; }
    const fld=curL.field; if(!fld) return;
    let alive=true; setGLoad(true);
    const nn=Math.pow(2,z), wpx=T*nn;
    const cwx=((lon+180)/360)*wpx, latRq=lat*Math.PI/180, cwy=((1-Math.log(Math.tan(latRq)+1/Math.cos(latRq))/Math.PI)/2)*wpx;
    const p2lon=px=>px/wpx*360-180, p2lat=py=>{ const e=Math.PI*(1-2*(py/wpx)); return Math.atan(Math.sinh(e))*180/Math.PI; };
    const lonL=p2lon(cwx-vw/2),lonR=p2lon(cwx+vw/2),latT=p2lat(cwy-VH/2),latB=p2lat(cwy+VH/2);
    const cols=14,rows=10,lats=[],lons=[];
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ lats.push((latT+(latB-latT)*j/(rows-1)).toFixed(4)); lons.push((lonL+(lonR-lonL)*i/(cols-1)).toFixed(4)); }
    const url="https://api.open-meteo.com/v1/forecast?latitude="+lats.join(",")+"&longitude="+lons.join(",")+"&current="+fld+(fld==="wind_speed_10m"?"&wind_speed_unit=kmh":"");
    (async()=>{ try{ const r=await(await fetch(url)).json(); if(!alive) return; const list=Array.isArray(r)?r:[r]; const vals=list.map(o=>(o&&o.current)?o.current[fld]:null); setGrid({cols,rows,vals,layer}); }catch(e){ if(alive) setGrid({cols,rows,vals:[],layer}); } finally{ if(alive) setGLoad(false); } })();
    return ()=>{alive=false;}; },[tl,layer,z,lat,lon,vw]);

  // Csapadék-előrejelzés rács: óránkénti precipitation a látható területre (ma + holnap)
  useEffect(()=>{ if(!tl){ return; }
    let alive=true; setFc(null);
    const nn=Math.pow(2,z), wpx=T*nn;
    const cwx=((lon+180)/360)*wpx, latRq=lat*Math.PI/180, cwy=((1-Math.log(Math.tan(latRq)+1/Math.cos(latRq))/Math.PI)/2)*wpx;
    const p2lon=px=>px/wpx*360-180, p2lat=py=>{ const e=Math.PI*(1-2*(py/wpx)); return Math.atan(Math.sinh(e))*180/Math.PI; };
    const lonL=p2lon(cwx-vw/2),lonR=p2lon(cwx+vw/2),latT=p2lat(cwy-VH/2),latB=p2lat(cwy+VH/2);
    const cols=14,rows=10,lats=[],lons=[];
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ lats.push((latT+(latB-latT)*j/(rows-1)).toFixed(4)); lons.push((lonL+(lonR-lonL)*i/(cols-1)).toFixed(4)); }
    const url="https://api.open-meteo.com/v1/forecast?latitude="+lats.join(",")+"&longitude="+lons.join(",")+"&hourly=precipitation&forecast_days=2&timezone=auto";
    (async()=>{ try{ const r=await(await fetch(url)).json(); if(!alive) return;
        const list=Array.isArray(r)?r:[r];
        const times=(list[0]&&list[0].hourly&&list[0].hourly.time)||[];
        const hours=times.map((_,hi)=>list.map(o=>(o&&o.hourly&&o.hourly.precipitation)?o.hourly.precipitation[hi]:null));
        const fr2=times.map(t=>({iso:t,ts:new Date(t).getTime()}));
        if(alive) setFc({cols,rows,hours,frames:fr2});
      }catch(e){ if(alive) setFc({cols,rows,hours:[],frames:[]}); } })();
    return ()=>{alive=false;}; },[tl,z,lat,lon,vw]);

  // statikus rács kirajzolása (sima, interpolált hőtérkép)
  useEffect(()=>{ const cv=canvasRef.current; if(!cv) return; const ctx=cv.getContext("2d");
    if(tl||!grid||grid.layer!==layer||!grid.vals.length){ if(!tl){ cv.width=vw; cv.height=VH; ctx.clearRect(0,0,vw,VH); } return; }
    const cols=grid.cols,rows=grid.rows,vals=grid.vals, stops=CMAP[layer]||CMAP.temp, dmin=curL.dom[0], dmax=curL.dom[1];
    const off=document.createElement("canvas"); off.width=cols; off.height=rows; const oc=off.getContext("2d"); const id=oc.createImageData(cols,rows);
    for(let k=0;k<cols*rows;k++){ const v=vals[k]; if(v==null||isNaN(v)){ id.data[k*4+3]=0; continue; } const c=cmapColor(stops,(v-dmin)/(dmax-dmin)); id.data[k*4]=c[0]; id.data[k*4+1]=c[1]; id.data[k*4+2]=c[2]; id.data[k*4+3]=255; }
    oc.putImageData(id,0,0);
    cv.width=vw; cv.height=VH; ctx.clearRect(0,0,vw,VH); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high"; ctx.drawImage(off,0,0,cols,rows,0,0,vw,VH);
  },[grid,vw,layer,tl]);

  // idővonal előrejelzés-kockáinak kirajzolása canvasra (radar-kockáknál üres → a radarcsempék látszanak)
  useEffect(()=>{ const cv=canvasRef.current; if(!cv) return; const ctx=cv.getContext("2d");
    if(!tl){ return; }
    const f=frames[idx];
    if(!f||f.kind!=="fc"||!fc||!fc.hours[f.hourIdx]){ cv.width=vw; cv.height=VH; ctx.clearRect(0,0,vw,VH); return; }
    const cols=fc.cols,rows=fc.rows,vals=fc.hours[f.hourIdx], stops=CMAP.precipfc, dmax=8;
    const off=document.createElement("canvas"); off.width=cols; off.height=rows; const oc=off.getContext("2d"); const im=oc.createImageData(cols,rows);
    for(let k=0;k<cols*rows;k++){ const v=vals[k]; if(v==null||isNaN(v)||v<0.1){ im.data[k*4+3]=0; continue; } const c=cmapColor(stops,Math.min(1,v/dmax)); im.data[k*4]=c[0]; im.data[k*4+1]=c[1]; im.data[k*4+2]=c[2]; im.data[k*4+3]=235; }
    oc.putImageData(im,0,0);
    cv.width=vw; cv.height=VH; ctx.clearRect(0,0,vw,VH); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high"; ctx.drawImage(off,0,0,cols,rows,0,0,vw,VH);
  },[tl,frames,idx,fc,vw]);

  const n=Math.pow(2,z), cx=((lon+180)/360)*n, latR=lat*Math.PI/180, cy=((1-Math.log(Math.tan(latR)+1/Math.cos(latR))/Math.PI)/2)*n;
  const originX=cx*T-vw/2, originY=cy*T-VH/2;
  const x0=Math.floor(originX/T),x1=Math.floor((originX+vw)/T),y0=Math.floor(originY/T),y1=Math.floor((originY+VH)/T);
  const tiles=[]; for(let tx=x0;tx<=x1;tx++) for(let ty=y0;ty<=y1;ty++){ if(ty<0||ty>=n) continue; tiles.push({key:tx+"_"+ty,wx:((tx%n)+n)%n,wy:ty,left:tx*T-originX,top:ty*T-originY}); }
  const fr=frames[idx];
  const baseSrc=(wx,wy)=>{
    if(base==="aerial") return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+z+"/"+wy+"/"+wx;
    if(base==="terrain") return "https://a.tile.opentopomap.org/"+z+"/"+wx+"/"+wy+".png";
    if(base==="plain") return "https://a.basemaps.cartocdn.com/rastertiles/voyager/"+z+"/"+wx+"/"+wy+".png";
    return "https://a.basemaps.cartocdn.com/dark_all/"+z+"/"+wx+"/"+wy+".png";
  };
  const radarOn= tl&&fr&&fr.kind==="radar"&&maps;
  let tLabel="", tKind="";
  if(tl&&fr){ const d=new Date(fr.ts), t0=new Date(); const sameDay=d.toDateString()===t0.toDateString(); const tom=new Date(t0.getTime()+86400000); const isTom=d.toDateString()===tom.toDateString(); const hm=d.toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"}); tLabel=(sameDay?"Ma ":(isTom?"Holnap ":""))+hm; tKind= fr.kind==="radar" ? (idx===0?"radar · most":"radar · nowcast") : "előrejelzés"; }

  return (
    <div className="rad-wrap">
      <div className="map-row"><span className="map-row-lbl">Nézet</span>
        <div className="map-modes">{MAP_BASES.map(b=>(<button key={b.id} title={b.label} className={"map-mode "+(base===b.id?"on":"")} onClick={()=>setBase(b.id)}>{b.ico}</button>))}</div>
      </div>
      <div className="map-row"><span className="map-row-lbl">Réteg</span>
        <div className="map-modes">{MAP_LAYERS.map(l=>(<button key={l.id} title={l.label} className={"map-mode "+(layer===l.id?"on":"")} onClick={()=>setLayer(l.id)}>{l.ico}</button>))}</div>
      </div>
      {err&&!maps&&tl?(<div className="rad-err">A térkép adatai jelenleg nem elérhetők.</div>):(
      <React.Fragment>
        <div className="rad-box" ref={boxRef} style={{height:VH}}>
          {tiles.map(t=>(<img key={"b"+t.key} alt="" className="rad-tile" src={baseSrc(t.wx,t.wy)} style={{left:t.left,top:t.top,width:T,height:T}} />))}
          {radarOn&&tiles.map(t=>{ const s=maps.host+fr.path+"/256/"+z+"/"+t.wx+"/"+t.wy+"/2/1_1.png"; return (<img key={"o"+t.key} alt="" className="rad-tile" src={s} onError={e=>{e.target.style.visibility="hidden";}} style={{left:t.left,top:t.top,width:T,height:T,opacity:0.85}} />); })}
          <canvas ref={canvasRef} style={{position:"absolute",left:0,top:0,width:vw+"px",height:VH+"px",opacity:tl?0.8:0.62,pointerEvents:"none"}} />
          <div className="rad-pin" style={{left:vw/2,top:VH/2}}><span></span></div>
          <div className="rad-zoom"><button onClick={()=>setZ(v=>Math.min(maxZ,v+1))}>＋</button><button onClick={()=>setZ(v=>Math.max(4,v-1))}>−</button></div>
          {tl&&!maps&&!fc&&<div className="rad-loading">betöltés…</div>}
          {!tl&&gLoad&&<div className="rad-loading">betöltés…</div>}
          {tl&&pre.total>0&&pre.done<pre.total&&<div className="rad-pre"><div className="rad-pre-bar" style={{width:Math.round(pre.done/pre.total*100)+"%"}}></div></div>}
        </div>
        {tl?(
          <React.Fragment>
            <div className="rad-ctrls">
              <button className="rad-play" onClick={()=>setPlaying(p=>!p)}>{playing?"⏸":"▶"}</button>
              <input className="rad-slider" type="range" min="0" max={Math.max(0,frames.length-1)} value={idx} onChange={e=>{setPlaying(false);setIdx(+e.target.value);}} />
              <span className={"rad-time "+(fr&&fr.kind==="fc"?"fut":"")}>{tLabel}{tKind?(" · "+tKind):""}</span>
            </div>
            <div style={{margin:"9px 4px 0"}}>
              <div style={{height:9,borderRadius:5,background:cmapCss(CMAP.precipfc)}}></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#9aa6b6",marginTop:5}}><span>0 mm</span><span>4</span><span>8+ mm/ó (előrejelzés)</span></div>
            </div>
          </React.Fragment>
        ):(
          <div style={{margin:"11px 4px 0"}}>
            <div style={{height:10,borderRadius:5,background:cmapCss(CMAP[layer]||CMAP.temp)}}></div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#9aa6b6",marginTop:5}}><span>{curL.dom[0]}{curL.unit}</span><span>{curL.dom[1]}{curL.unit}</span></div>
          </div>
        )}
        <div className="map-cap">{curL.cap}</div>
      </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  /* FEJLESZTŐI MÓD: a service worker kikapcsolva, hogy minden frissítés azonnal látszódjon.
     Eltávolítja a korábban regisztrált SW-t, és kiüríti a régi cache-t.
     Élesben visszakapcsolható: töröld ezt a blokkot, és tedd vissza a register("sw.js")-t. */
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  if(window.caches&&caches.keys){ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{}); }
}
</script>
</body>
</html>
